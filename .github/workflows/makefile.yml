name: TestAddon CI/CD

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

permissions:
  contents: write 


jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Lua
        uses: leafo/gh-actions-lua@v8.0.0
        with:
          luaVersion: '5.1'

      - uses: leafo/gh-actions-luarocks@v4
          
      - name: Install dependencies
        run: |
          luarocks install busted
          luarocks install luacov
          
      - name: Run tests
        run: |
          busted tests/*.test.lua

  release:
    name: Create Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Create release archive
        run: |
          make release

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_tag="${GITHUB_REF_NAME}"
          if [ -f "tasks/releases/$current_tag.md" ]; then
            cp "tasks/releases/$current_tag.md" release-notes.md
            exit 0
          fi
          previous_tag="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')"

          if [ -n "$previous_tag" ]; then
            {
              printf 'Changes since %s:\n\n' "$previous_tag"
              git log --reverse --pretty=format:'- %s' "$previous_tag..$current_tag"
              printf '\n'
            } > release-notes.md
          else
            {
              printf 'Changes:\n\n'
              git log --reverse --pretty=format:'- %s' "$current_tag"
              printf '\n'
            } > release-notes.md
          fi
          
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_tag="${GITHUB_REF_NAME}"
          if gh release view "$current_tag" --json isDraft > existing-release.json; then
            if [ "$(jq -r .isDraft existing-release.json)" != "true" ]; then
              echo "Refusing to replace a published release."
              exit 1
            fi
            gh release edit "$current_tag" --title "RLHelper ${current_tag#v}" --target "$GITHUB_SHA" --notes-file release-notes.md
          else
            gh release create "$current_tag" --verify-tag --title "RLHelper ${current_tag#v}" --notes-file release-notes.md --draft --prerelease
          fi
          gh release upload "$current_tag" RLHelper.zip --clobber
